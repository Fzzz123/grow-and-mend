<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Grow &amp; Mend</title>
<style>
  body { margin:0; font-family:Georgia,serif; background:#f7f3e8; color:#23312a; }
  h1 { text-align:center; color:#2f6b3f; padding:30px 10px 0; margin:0; }
  p.sub { text-align:center; margin:6px 0 20px; }
  .grid { max-width:1100px; margin:0 auto; padding:0 20px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  figure { margin:0; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  img { width:100%; display:block; }
  figcaption { padding:10px 12px; font-size:.95rem; }
  .tag { font-size:.8rem; color:#fff; background:#7fb069; border-radius:999px; padding:1px 8px; }
  .tag.fashion { background:#d98e5f; }
</style>
</head>
<body>
<h1>Community gallery</h1>
<p class="sub"><a href="index.html">← Back to the studio</a></p>
<div class="grid" id="grid">Loading…</div>
<script>
fetch('/api/submissions').then(r=>r.json()).then(list=>{
  const g=document.getElementById('grid');
  if(!list.length){ g.textContent='No designs yet. Be the first!'; return; }
  g.innerHTML='';
  list.forEach(s=>{
    const f=document.createElement('figure');
    const img=document.createElement('img'); img.src='/submissions/'+s.file; img.loading='lazy';
    const c=document.createElement('figcaption');
    const tag=document.createElement('span'); tag.className='tag '+s.mode; tag.textContent=s.mode==='green'?'Green space':'Upcycled fashion';
    c.append(tag,' ',document.createTextNode((s.name||'Anonymous')+(s.note?' — '+s.note:'')));
    f.append(img,c); g.append(f);
  });
}).catch(()=>{ document.getElementById('grid').textContent='Gallery needs the server running.'; });
</script>
</body>
</html>
